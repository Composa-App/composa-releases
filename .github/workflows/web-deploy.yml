name: Composa web deploy

# Deploys a Composa commit to Vercel. staging makes a preview deployment, which
# changes nothing users see. production goes live on the project's domains and
# waits for the required reviewer.
#
# Vercel builds the app itself, with its own COMPOSA_UI_TOKEN and VITE_* values.
# This log is public, so it never prints the deployment URL. Find it with
# `vercel ls composa-app --scope daris-team`.
#
# review_alias (staging only) also points composa-review-daris-team.vercel.app at
# the new preview, so the same address always shows the newest review build and
# a browser only has to allow one site.
#
# recording_alias (staging only) does the same for
# composa-recording-daris-team.vercel.app, so a second build can be tested in
# parallel without moving the review address. review_alias wins if both are set.
#
# aichat_alias (staging only) does the same for composa-aichat-daris-team.vercel.app,
# for the AI chat build. Order when more than one is set: review, recording, aichat.

run-name: 'Composa web deploy: ${{ inputs.target }}${{ inputs.sha && format('' at {0}'', inputs.sha) || '''' }}'

on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        required: true
        default: staging
        type: choice
        options: [staging, production]
      sha:
        description: Composa commit to deploy instead of main (full SHA)
        required: false
        type: string
      review_alias:
        description: Staging only. Also point composa-review-daris-team.vercel.app at this preview
        required: false
        default: false
        type: boolean
      recording_alias:
        description: Staging only. Point composa-recording-daris-team.vercel.app at this preview instead
        required: false
        default: false
        type: boolean
      aichat_alias:
        description: Staging only. Point composa-aichat-daris-team.vercel.app at this preview instead
        required: false
        default: false
        type: boolean

concurrency:
  group: composa-web-deploy-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.target == 'production' && 'composa-production' || 'composa-staging' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Choose the commit
        id: ref
        env:
          SHA: ${{ inputs.sha }}
        run: |
          [ -z "$SHA" ] || [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full 40-character commit"; exit 1; }
          echo "ref=${SHA:-main}" >> "$GITHUB_OUTPUT"

      - id: source
        uses: ./.github/actions/fetch-source
        with:
          ref: ${{ steps.ref.outputs.ref }}
          deploy_key: ${{ secrets.COMPOSA_SOURCE_DEPLOY_KEY }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Deploy
        working-directory: ${{ runner.temp }}/composa-source
        env:
          TARGET: ${{ inputs.target }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_QQGshTbgTCAkvBKiUtcJ9Rf1
          VERCEL_PROJECT_ID: prj_23vfsNmatnLrTZNcl3dAA3qVTJ7B
        run: |
          [ -n "$VERCEL_TOKEN" ] || { echo "VERCEL_TOKEN is not set."; exit 1; }
          args=(deploy --yes --token "$VERCEL_TOKEN")
          [ "$TARGET" = production ] && args+=(--prod)
          log="$RUNNER_TEMP/deploy.log"
          url_file="$RUNNER_TEMP/deploy.url"
          # The CLI prints the deployment URL on stdout and progress on stderr.
          if ! npx --yes vercel@65.9.0 "${args[@]}" > "$url_file" 2> "$log"; then
            echo "The deploy failed. Its errors:"
            cat "$url_file" >> "$log"
            grep -iE 'error' "$log" | sed -E 's#https://[^ ]+#[url]#g' | cut -c1-300 || true
            rm -f "$log" "$url_file"
            exit 1
          fi
          rm -f "$log"
          echo "Deployed ${{ steps.source.outputs.sha }} to $TARGET."

      - name: Point the review address at this preview
        if: inputs.target == 'staging' && (inputs.review_alias || inputs.recording_alias || inputs.aichat_alias)
        env:
          ADDRESS: ${{ inputs.review_alias && 'composa-review-daris-team.vercel.app' || inputs.recording_alias && 'composa-recording-daris-team.vercel.app' || 'composa-aichat-daris-team.vercel.app' }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_QQGshTbgTCAkvBKiUtcJ9Rf1
          VERCEL_PROJECT_ID: prj_23vfsNmatnLrTZNcl3dAA3qVTJ7B
        run: |
          url_file="$RUNNER_TEMP/deploy.url"
          url="$(grep -oE 'https://[a-z0-9.-]+\.vercel\.app' "$url_file" | tail -n1)"
          rm -f "$url_file"
          [ -n "$url" ] || { echo "Could not find the preview URL in the deploy output."; exit 1; }
          # The REST API, not `vercel alias`: the CLI looks up a user, which a team token doesn't have.
          host="${url#https://}"
          api=https://api.vercel.com
          id="$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" "$api/v13/deployments/$host?teamId=$VERCEL_ORG_ID" | jq -r '.id // empty')"
          [ -n "$id" ] || { echo "Vercel didn't return the preview's deployment id."; exit 1; }
          code="$(curl -sS -o "$RUNNER_TEMP/alias.json" -w '%{http_code}' -X POST -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
            --data "{\"alias\":\"$ADDRESS\"}" "$api/v2/deployments/$id/aliases?teamId=$VERCEL_ORG_ID")"
          if [ "$code" != 200 ]; then
            echo "Setting the review address failed ($code): $(jq -r '.error.code + ": " + .error.message' "$RUNNER_TEMP/alias.json" 2>/dev/null | cut -c1-300)"
            rm -f "$RUNNER_TEMP/alias.json"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/alias.json"
          echo "$ADDRESS now shows ${{ steps.source.outputs.sha }}."

      - name: Check the live site answers
        if: inputs.target == 'production'
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 10 --retry-all-errors https://dev.composa.app/)"
          echo "dev.composa.app answered $code"
          [ "$code" = 200 ]

      - name: Remove private source
        if: always()
        run: rm -rf "$RUNNER_TEMP/composa-source" "$RUNNER_TEMP/source-key" "$RUNNER_TEMP/deploy.url"
